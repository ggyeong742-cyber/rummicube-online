function showScreen(name){

function stopListeners(){
  for(const [ref,event,callback] of listeners){
    ref.off(event,callback);
  }
  listeners=[];
}

function listen(ref,event,callback){
  ref.on(event,callback);
  listeners.push([ref,event,callback]);
}

function normalizeCode(value){
  return value.trim().toUpperCase();
}

async function login(){
  if(auth.currentUser){
    uid=auth.currentUser.uid;
    return uid;
  }

  if(!authPromise){
    authPromise=auth.signInAnonymously().catch(error=>{
      authPromise=null;
      throw error;
    });
  }

  const result=await authPromise;
  uid=result.user.uid;
  return uid;
}

function makeTile(color,num,joker=false){
  return {
    id:crypto.randomUUID(),
    color,
    num,
    joker
  };
}

function makeDeck(jokerCount){
  const deck=[];

  for(const color of Object.keys(COLORS)){
    for(let num=1;num<=13;num++){
      for(let copy=0;copy<2;copy++){
        deck.push(makeTile(color,num));
      }
    }
  }

  for(let i=0;i<jokerCount;i++){
    deck.push(makeTile(null,0,true));
  }

  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }

  return deck;
}

function validGroup(group){
  if(!Array.isArray(group) || group.length<3 || group.length>13) return false;

  const normal=group.filter(t=>!t.joker);
  const jokers=group.length-normal.length;

  if(!normal.length) return false;

  if(normal.some(t=>
    !Number.isInteger(t.num) ||
    t.num<1 ||
    t.num>13 ||
    !Object.prototype.hasOwnProperty.call(COLORS,t.color)
  )) return false;

  const numbers=normal.map(t=>t.num);
  const colors=normal.map(t=>t.color);

  const isSet=
    group.length<=4 &&
    new Set(numbers).size===1 &&
    new Set(colors).size===colors.length &&
    normal.length+jokers<=4;

  if(isSet) return true;

  const isRun=
    new Set(colors).size===1 &&
    new Set(numbers).size===numbers.length;

  if(isRun){
    for(let start=1;start<=14-group.length;start++){
      const sequence=Array.from(
        {length:group.length},
        (_,i)=>start+i
      );

      if(numbers.every(n=>sequence.includes(n))){
        const missing=sequence.filter(n=>!numbers.includes(n));

        if(missing.length===jokers) return true;
      }
    }
  }

  return false;
}

function jokerValuesForGroup(group){
  const normal=group.filter(t=>!t.joker);
  const jokers=group.filter(t=>t.joker);

  if(!jokers.length) return [];

  if(!normal.length) return jokers.map(()=>0);

  const numbers=normal.map(t=>t.num);
  const colors=normal.map(t=>t.color);

  if(new Set(numbers).size===1 &&
     new Set(colors).size===colors.length){
    return jokers.map(()=>numbers[0]);
  }

  if(new Set(colors).size===1 &&
     new Set(numbers).size===numbers.length){
    for(let start=1;start<=14-group.length;start++){
      const sequence=Array.from(
        {length:group.length},
        (_,i)=>start+i
      );

      if(numbers.every(n=>sequence.includes(n))){
        const missing=sequence.filter(n=>!numbers.includes(n));

        if(missing.length===jokers.length){
          return missing;
        }
      }
    }
  }

  return jokers.map(()=>0);
}

function groupScore(group){
  const normal=group.filter(t=>!t.joker);
  const jokerValues=jokerValuesForGroup(group);

  return normal.reduce((sum,t)=>sum+t.num,0)+
    jokerValues.reduce((sum,n)=>sum+n,0);
}

function splitGroups(tiles){
  if(!Array.isArray(tiles) || tiles.length<3) return [];

  const count=tiles.length;
  const candidatesByFirst=Array.from({length:count},()=>[]);

  function generate(start,chosen){
    if(chosen.length>=3){
      const group=chosen.map(i=>tiles[i]);

      if(validGroup(group)){
        const candidate={
          indexes:[...chosen],
          group,
          score:groupScore(group)
        };

        chosen.forEach(index=>{
          candidatesByFirst[index].push(candidate);
        });
      }
    }

    if(chosen.length===13) return;

    for(let i=start;i<count;i++){
      chosen.push(i);
      generate(i+1,chosen);
      chosen.pop();
    }
  }

  generate(0,[]);

  for(const candidates of candidatesByFirst){
    candidates.sort((a,b)=>
      b.score-a.score || b.group.length-a.group.length
    );
  }

  const memo=new Map();

  function search(remaining){
    if(!remaining.length) return [];

    const key=remaining.join(",");

    if(memo.has(key)) return memo.get(key);

    const first=remaining[0];
    const remainingSet=new Set(remaining);

    for(const candidate of candidatesByFirst[first]){
      if(!candidate.indexes.every(i=>remainingSet.has(i))) continue;

      const used=new Set(candidate.indexes);
      const next=remaining.filter(i=>!used.has(i));
      const result=search(next);

      if(result){
        const answer=[candidate.group,...result];
        memo.set(key,answer);
        return answer;
      }
    }

    memo.set(key,null);
    return null;
  }

  return search(Array.from({length:count},(_,i)=>i))||[];
}

function sortGroup(group){
  const jokerValues=jokerValuesForGroup(group);
  const values=new Map();
  let jokerIndex=0;

  group.forEach(t=>{
    if(t.joker){
      values.set(t.id,jokerValues[jokerIndex++]??0);
    }else{
      values.set(t.id,t.num);
    }
  });

  return [...group].sort((a,b)=>
    values.get(b.id)-values.get(a.id)
  );
}

async function createRoom(){
  if(actionBusy) return;

  actionBusy=true;
  $("createButton").disabled=true;

  try{
    await login();

    const name=$("hostName").value.trim();
    const code=normalizeCode($("createCode").value);
    const jokerCount=Number($("jokerSetting").value);

    if(!name){

      return;
    }

    if(!/^[A-Z0-9]{4,8}$/.test(code)){

      return;

  }finally{
    actionBusy=false;
    $("createButton").disabled=false;
  }
}

async function joinRoom(){
  if(actionBusy) return;

  actionBusy=true;
  $("joinButton").disabled=true;

  let memberReserved=false;
  let orderReserved=false;
  let code="";

  try{
    await login();

    const name=$("joinName").value.trim();
    code=normalizeCode($("joinCode").value);

    if(!name){
      alert("닉네임을 입력하세요.");
      return;
    }

    if(!/^[A-Z0-9]{4,8}$/.test(code)){
      alert("방 코드는 영문 대문자와 숫자로 된 4~8자여야 합니다.");
      return;
    }

    const ref=db.ref("rooms/"+code);
    const snapshot=await ref.get();

    if(!snapshot.exists()){
      alert("존재하지 않는 방입니다.");
      return;
    }

    const data=snapshot.val();

    if(data.status!=="waiting"){
      alert("이미 게임이 시작된 방입니다.");
      return;
    }

    if(!data.members || !Array.isArray(data.order)){
      alert("방 데이터가 올바르지 않습니다.");
      return;
    }

    if(data.members[uid]){
      nickname=name;
      roomCode=code;
      enterRoom();
      return;
    }

    if(data.order.length>=4){
      alert("방 인원이 가득 찼습니다.");
      return;
    }

    await ref.child("members/"+uid).set({
      nickname:name,
      ready:false,
      joinedAt:Date.now(),
      handCount:0
    });

    memberReserved=true;

    const orderRef=ref.child("order");

    const result=await orderRef.transaction(current=>{
      const currentOrder=Array.isArray(current)?current:[];

      if(currentOrder.includes(uid)){
        return currentOrder;
      }

      if(currentOrder.length>=4){
        return;
      }

      return [...currentOrder,uid];
    });

    if(!result.committed){
      throw new Error("방 인원이 가득 찼거나 참가자 목록 갱신에 실패했습니다.");
    }

    orderReserved=true;
    nickname=name;
    roomCode=code;
    enterRoom();

  }catch(error){
    console.error("방 참가 오류:",error);

    if(code){
      try{
        const ref=db.ref("rooms/"+code);

        if(orderReserved){
          await ref.child("order").transaction(current=>{
            if(!Array.isArray(current)) return current;
            return current.filter(id=>id!==uid);
          });
        }

        if(memberReserved){
          await ref.child("members/"+uid).remove();
        }
      }catch(cleanupError){
        console.error("참가 취소 처리 오류:",cleanupError);
      }
    }

    alert(
      "방 참가에 실패했습니다.\n"+
      "오류 코드: "+(error.code||"UNKNOWN")+"\n"+
      "오류 내용: "+error.message
    );

  }finally{
    actionBusy=false;
    $("joinButton").disabled=false;
  }
}

async function armHostDisconnectCleanup(){
  if(disconnectArmed || !roomCode || !isHost()) return;

  disconnectArmed=true;

  const code=roomCode;
  const cleanup={};

  cleanup["rooms/"+code]=null;
  cleanup["privateHands/"+code]=null;

  try{
    await db.ref().onDisconnect().update(cleanup);
  }catch(error){
    disconnectArmed=false;
    console.error(error);
    $("lobbyMessage").textContent="자동 방 삭제 예약에 실패했습니다. Firebase 규칙을 확인하세요.";
  }
}

  listen(roomRef(),"value",snapshot=>{

      if(!leavingRoom) alert("방장이 나갔거나 방이 삭제되었습니다.");
      leaveLocal();

    }

    roomData=snapshot.val();

      if(!leavingRoom) alert("방에서 나갔습니다.");

    if(isHost()) armHostDisconnectCleanup();

    if(roomData.status==="playing" || roomData.status==="finished"){

}

function renderLobby(){
  if(!roomData || !roomData.members) return;

  const order=memberIds();
  const members=roomData.members;

  $("playerCount").textContent=order.length+"/4명";
  $("players").innerHTML="";

  order.forEach(id=>{
    const player=members[id];
    if(!player) return;

    const div=document.createElement("div");
    div.className="player";

    const left=document.createElement("span");
    left.textContent=player.nickname+(id===roomData.hostUid?" (방장)":"");

    const right=document.createElement("strong");
    right.textContent=player.ready?"준비 완료":"준비 중";
    right.style.color=player.ready?"#81c784":"#ffcc80";

    div.append(left,right);
    $("players").appendChild(div);
  });

  const jokerCount=Number(roomData.settings.jokerCount);

  $("settingText").textContent=
    "조커 "+jokerCount+"개 / 난이도 "+({0:"상",1:"중",2:"하"}[jokerCount]);

  $("lobbyJokers").value=String(jokerCount);
  $("hostSettings").classList.toggle("hidden",!isHost());

  $("settingsNotice").textContent=isHost()
    ?"방장만 설정을 변경할 수 있습니다."
    :"방장이 게임 설정을 관리합니다.";

  const allReady=order.length>=2 &&
    order.length<=4 &&
    order.every(id=>members[id] && members[id].ready===true);

  $("startButton").classList.toggle("hidden",!isHost());
  $("startButton").disabled=!allReady;

  $("readyButton").textContent=members[uid].ready?"준비 취소":"준비 완료";

  if(order.length<2){
    $("lobbyMessage").textContent="게임을 시작하려면 최소 2명이 필요합니다.";
  }else if(!allReady){
    $("lobbyMessage").textContent="모든 참가자가 준비 완료해야 합니다.";
  }else{
    $("lobbyMessage").textContent="모두 준비 완료! 방장이 게임을 시작할 수 있습니다.";
  }
}

async function saveSettings(){
  if(!isHost() || !roomData || roomData.status!=="waiting") return;

  const jokerCount=Number($("lobbyJokers").value);

  if(![0,1,2].includes(jokerCount)){
    alert("올바른 조커 개수를 선택하세요.");
    return;
  }

  try{
    const updates={};
    updates["settings/jokerCount"]=jokerCount;

    for(const id of memberIds()){
      updates["members/"+id+"/ready"]=false;
    }

    await roomRef().update(updates);

    $("lobbyMessage").textContent=
      "설정이 변경되었습니다. 모든 참가자의 준비 상태가 초기화되었습니다.";
  }catch(error){
    console.error(error);
    alert("설정을 변경하지 못했습니다. Firebase 규칙을 확인하세요.\n"+error.message);
  }
}

async function toggleReady(){
  if(!roomData || roomData.status!=="waiting") return;

  const member=roomData.members[uid];
  if(!member) return;

  try{
    await roomRef().child("members/"+uid+"/ready").set(!member.ready);
  }catch(error){
    console.error(error);
    alert("준비 상태 변경에 실패했습니다. Firebase 규칙을 확인하세요.\n"+error.message);
  }
}

async function startOnlineGame(){
  if(actionBusy || !isHost() || !roomData) return;

  actionBusy=true;
  $("startButton").disabled=true;

  try{
    const order=memberIds();

    if(order.length<2 || order.length>4){
      alert("게임을 시작하려면 2~4명이 필요합니다.");
      return;
    }

    if(!order.every(id=>roomData.members[id] && roomData.members[id].ready===true)){
      alert("모든 참가자가 준비해야 합니다.");
      return;
    }

    const deck=makeDeck(Number(roomData.settings.jokerCount));
    const updates={};

    for(const id of order){
      const hand=[];

      for(let i=0;i<14;i++){
        hand.push(deck.pop());
      }

      updates["privateHands/"+roomCode+"/"+id]=hand;
      updates["rooms/"+roomCode+"/members/"+id+"/handCount"]=14;
    }

    updates["rooms/"+roomCode+"/game"]={
      deck,
      table:[],
      turnUid:order[0],
      turnNumber:1,
      opened:{},
      winnerUid:null
    };

    updates["rooms/"+roomCode+"/status"]="playing";

    await db.ref().update(updates);
  }catch(error){
    console.error("게임 시작 오류:",error);
    alert("게임을 시작하지 못했습니다.\n"+(error.code||"UNKNOWN")+" / "+error.message);
  }finally{
    actionBusy=false;
  }
}

function startGameView(){
  showScreen("game");

  selectedHand.clear();
  selectedField=null;
  undoSnapshot=null;
  turnSnapshot=null;
  recoveryUsed=false;
  previousTurn=null;
  gameOverShown=false;
  handLoaded=false;

  listen(handsRef().child(uid),"value",snapshot=>{
    myHand=snapshot.val()||[];
    handLoaded=true;

    if(roomData && roomData.game && isMyTurn() && !turnSnapshot){
      saveTurnSnapshot();
    }

    renderGame();
  });
}

function saveUndoSnapshot(){
  undoSnapshot={
    table:structuredClone(roomData.game.table||[]),
    hand:structuredClone(myHand)
  };
}

function saveTurnSnapshot(){
  turnSnapshot={
    table:structuredClone(roomData.game.table||[]),
    hand:structuredClone(myHand)
  };
}

async function writeGameAndHand(game,hand){
  if(!uid || !roomCode){
    throw new Error("로그인 또는 방 정보가 없습니다.");
  }

  if(!auth.currentUser || auth.currentUser.uid!==uid){
    throw new Error("Firebase 로그인 정보가 일치하지 않습니다.");
  }

  if(!Array.isArray(hand)){
    throw new Error("손패 데이터 형식이 올바르지 않습니다.");
  }

  const memberSnapshot=await roomRef().child("members/"+uid).get();

  if(!memberSnapshot.exists()){
    throw new Error("현재 방의 참가자 정보가 없습니다.");
  }

  const updates={};

  updates["rooms/"+roomCode+"/game"]=game;
  updates["privateHands/"+roomCode+"/"+uid]=hand;
  updates["rooms/"+roomCode+"/members/"+uid+"/handCount"]=hand.length;

  await db.ref().update(updates);
}

async function submitHandTiles(){
  if(actionBusy || !isMyTurn() || !handLoaded) return;

  const indexes=[...selectedHand].sort((a,b)=>a-b);

  if(!indexes.length) return;

  const chosen=indexes.map(i=>myHand[i]).filter(Boolean);

  if(chosen.length!==indexes.length){
    setMessage("선택한 타일 정보를 확인할 수 없습니다.");
    return;
  }

  const groups=splitGroups(chosen);

  if(!groups.length){
    setMessage("선택한 타일로 유효한 조합을 만들 수 없습니다.");
    return;
  }

  const submittedIds=new Set(groups.flat().map(t=>t.id));

  if(submittedIds.size!==chosen.length ||
     !chosen.every(t=>submittedIds.has(t.id))){
    setMessage("선택한 타일 전체를 유효한 조합으로 나눌 수 없습니다.");
    return;
  }

  actionBusy=true;

  try{
    const score=groups.reduce(
      (sum,g)=>sum+groupScore(g),0
    );

    const opened=(roomData.game.opened||{})[uid]===true;

    if(!opened && score<30){
      const game=structuredClone(roomData.game);

      if(game.deck && game.deck.length){
        const hand=[...myHand,game.deck.pop()];

        await writeGameAndHand(game,hand);

        selectedHand.clear();
        selectedField=null;

        await finishMyTurn();

        setMessage(
          "최초 등록 30점 미달: "+score+
          "점이므로 타일을 한 장 가져왔습니다."
        );
      }else{
        await finishMyTurn();
        setMessage("최초 등록 30점 미달: 덱이 비어 있습니다.");
      }

      return;
    }

    saveUndoSnapshot();

    const game=structuredClone(roomData.game);
    const ordered=groups.map(sortGroup);

    game.table=game.table||[];
    game.table.push(...ordered);

    game.opened=game.opened||{};
    game.opened[uid]=true;

    const chosenIds=new Set(chosen.map(t=>t.id));
    const hand=myHand.filter(t=>!chosenIds.has(t.id));

    selectedHand.clear();
    selectedField=null;

    if(!hand.length){
      game.winnerUid=uid;

      await writeGameAndHand(game,hand);
      await roomRef().child("status").set("finished");

      setMessage("모든 타일을 제출했습니다. 승리했습니다!");
      return;
    }

    await writeGameAndHand(game,hand);

    setMessage("타일 제출 성공! 등록 점수: "+score+"점");

  }catch(error){
    console.error("타일 제출 오류:",error);

    setMessage(
      "타일 제출 실패 | "+
      (error.code||"UNKNOWN")+" | "+
      (error.message||String(error))
    );

  }finally{
    actionBusy=false;
    renderGame();
  }
}

async function moveFieldTile(){
  if(actionBusy || !isMyTurn() || !selectedField || !handLoaded) return;

  actionBusy=true;

  try{
    const {groupIndex,tileIndex}=selectedField;
    const game=structuredClone(roomData.game);

    if(!game.table[groupIndex] || !game.table[groupIndex][tileIndex]) return;

    saveUndoSnapshot();

    const [tile]=game.table[groupIndex].splice(tileIndex,1);

    if(!game.table[groupIndex].length){
      game.table.splice(groupIndex,1);
    }

    const hand=[...myHand,tile];

    selectedField=null;

    await writeGameAndHand(game,hand);
    setMessage("필드 타일을 내 패로 이동했습니다.");
  }catch(error){
    console.error("필드 타일 이동 오류:",error);
    setMessage("필드 타일 이동 실패: "+(error.code||"UNKNOWN")+" / "+error.message);
  }finally{
    actionBusy=false;
    renderGame();
  }
}

async function finishMyTurn(){
  if(!isMyTurn()) return false;

  const order=memberIds();

  if(!order.length) return false;

  const gameRef=roomRef().child("game");

  const result=await gameRef.transaction(current=>{
    if(!current || current.turnUid!==uid || current.winnerUid) return;

    const currentIndex=order.indexOf(uid);
    if(currentIndex<0) return;

    const next=order[(currentIndex+1)%order.length];

    return {
      ...current,
      turnUid:next,
      turnNumber:(current.turnNumber||1)+1
    };
  });

  selectedHand.clear();
  selectedField=null;

  return result.committed;
}

async function drawTile(){
  if(actionBusy || !isMyTurn() || !handLoaded) return;

  actionBusy=true;

  try{
    const game=structuredClone(roomData.game);

    if(!game.deck.length){
      setMessage("덱에 남은 타일이 없습니다.");
      await finishMyTurn();
      return;
    }

    const hand=[...myHand,game.deck.pop()];

    selectedHand.clear();
    selectedField=null;

    await writeGameAndHand(game,hand);
    await finishMyTurn();

    setMessage("타일 한 개를 가져왔습니다.");
  }catch(error){
    console.error("타일 가져오기 오류:",error);
    setMessage("타일을 가져오지 못했습니다: "+(error.code||"UNKNOWN")+" / "+error.message);
  }finally{
    actionBusy=false;
    renderGame();
  }
}

async function endTurn(){
  if(actionBusy || !isMyTurn()) return;

  actionBusy=true;

  try{
    selectedHand.clear();
    selectedField=null;

    await finishMyTurn();
    setMessage("턴을 종료했습니다.");
  }catch(error){
    console.error("턴 종료 오류:",error);
    setMessage("턴을 종료하지 못했습니다: "+error.message);
  }finally{
    actionBusy=false;
    renderGame();
  }
}

async function restoreLastAction(){
  if(actionBusy || !isMyTurn() || !handLoaded) return;

  if(recoveryUsed){
    setMessage("이번 차례의 복구 기회를 이미 사용했습니다.");
    return;
  }

  if(!undoSnapshot){
    setMessage("복구할 조작이 없습니다.");
    return;
  }

  actionBusy=true;

  try{
    recoveryUsed=true;

    const game=structuredClone(roomData.game);
    game.table=structuredClone(undoSnapshot.table);

    await writeGameAndHand(game,structuredClone(undoSnapshot.hand));

    undoSnapshot=null;
    selectedHand.clear();
    selectedField=null;

    setMessage("마지막 조작을 복구했습니다.");
  }catch(error){
    console.error("복구 오류:",error);
    recoveryUsed=false;
    setMessage("복구 실패: "+(error.code||"UNKNOWN")+" / "+error.message);
  }finally{
    actionBusy=false;
    renderGame();
  }
}

async function resetTurn(){
  if(actionBusy || !isMyTurn() || !turnSnapshot || !handLoaded) return;

  actionBusy=true;

  try{
    const game=structuredClone(roomData.game);
    game.table=structuredClone(turnSnapshot.table);

    recoveryUsed=false;
    undoSnapshot=null;
    selectedHand.clear();
    selectedField=null;

    await writeGameAndHand(game,structuredClone(turnSnapshot.hand));

    setMessage("이전 플레이어 상태로 복원했습니다.");
  }catch(error){
    console.error("상태 복원 오류:",error);
    setMessage("상태 복원 실패: "+(error.code||"UNKNOWN")+" / "+error.message);
  }finally{
    actionBusy=false;
    renderGame();
  }
}

function tileClass(tile){
  if(tile.joker) return "joker";
  return COLORS[tile.color]||"";
}

function createTileElement(tile,small=false,selected=false){
  const div=document.createElement("div");

  div.className="tile "+tileClass(tile)+
    (small?" small":"")+
    (selected?" selected":"");

  div.textContent=tile.joker?"★":tile.num;

  return div;
}

function setMessage(text){
  $("gameMessage").textContent=text;
}

function renderGame(){
  if(!roomData || !roomData.game) return;

  const game=roomData.game;
  const order=memberIds();
  const members=roomData.members||{};
  const myTurn=isMyTurn();

  $("gameRoomInfo").textContent="방 코드: "+roomCode;

  const current=members[game.turnUid];

  $("turnInfo").textContent=game.winnerUid
    ?"게임 종료"
    :(myTurn?"내 차례":(current?current.nickname+" 차례":"상대 차례"));

  $("deckInfo").textContent="남은 타일: "+(game.deck||[]).length;

  if(previousTurn!==game.turnUid){
    previousTurn=game.turnUid;
    selectedHand.clear();
    selectedField=null;
    undoSnapshot=null;
    recoveryUsed=false;
    turnSnapshot=null;

    if(myTurn && handLoaded){
      saveTurnSnapshot();
      setMessage("내 차례입니다. 타일을 선택하세요.");
    }
  }

  if(myTurn && handLoaded && !turnSnapshot){
    saveTurnSnapshot();
  }

  $("opponents").innerHTML="";

  order.filter(id=>id!==uid).forEach(id=>{
    const player=members[id];
    const div=document.createElement("div");

    div.className="player";
    div.textContent=(player?player.nickname:"플레이어")+
      " · 타일 "+(player?player.handCount:0)+"개";

    $("opponents").appendChild(div);
  });

  $("board").innerHTML="";

  (game.table||[]).forEach((group,gi)=>{
    const groupDiv=document.createElement("div");
    groupDiv.className="group";

    group.forEach((tile,ti)=>{
      const el=createTileElement(
        tile,
        true,
        selectedField &&
        selectedField.groupIndex===gi &&
        selectedField.tileIndex===ti
      );

      el.addEventListener("click",()=>{
        if(!myTurn || actionBusy) return;

        selectedHand.clear();
        selectedField={groupIndex:gi,tileIndex:ti};

        renderGame();
      });

      groupDiv.appendChild(el);
    });

    $("board").appendChild(groupDiv);
  });

  $("hand").innerHTML="";

  myHand.forEach((tile,index)=>{
    const el=createTileElement(
      tile,
      false,
      selectedHand.has(index)
    );

    el.addEventListener("click",()=>{
      if(!myTurn || actionBusy) return;

      selectedField=null;

      if(selectedHand.has(index)){
        selectedHand.delete(index);
      }else{
        selectedHand.add(index);
      }

      renderGame();
    });

    $("hand").appendChild(el);
  });

  $("drawButton").disabled=!myTurn || !!game.winnerUid || actionBusy;
  $("endButton").disabled=!myTurn || !!game.winnerUid || actionBusy;
  $("undoButton").disabled=!myTurn || !undoSnapshot || recoveryUsed || actionBusy;
  $("resetButton").disabled=!myTurn || !turnSnapshot || actionBusy;

  if(game.winnerUid && !gameOverShown){
    gameOverShown=true;
    const winner=members[game.winnerUid];
    setMessage((winner?winner.nickname:"플레이어")+" 승리!");
  }
}

async function handleEnter(){
  if(currentScreen!=="game" || !isMyTurn() || actionBusy) return;

  if(selectedField){
    await moveFieldTile();
    return;
  }

  if(selectedHand.size){
    await submitHandTiles();
    return;
  }

  setMessage("타일을 선택하세요.");
}

async function sendChat(inputId){
  const input=$(inputId);
  const text=input.value.trim();

  if(!text || !roomCode || !uid) return;

  input.value="";

  try{
    await roomRef().child("chat").push({
      uid,
      nickname,
      text:text.slice(0,200),
      time:firebase.database.ServerValue.TIMESTAMP
    });
  }catch(error){
    console.error(error);
    alert("메시지를 전송하지 못했습니다: "+error.message);
  }
}

function renderChat(messages){
  const containers=[$("chatMessages"),$("gameChatMessages")];

  const entries=Object.values(messages)
    .sort((a,b)=>(a.time||0)-(b.time||0))
    .slice(-80);

  for(const container of containers){
    if(!container) continue;

    container.innerHTML="";

    entries.forEach(item=>{
      const line=document.createElement("div");
      line.className="chatline";

      const name=document.createElement("span");
      name.className="chatname";
      name.textContent=(item.nickname||"사용자")+": ";

      const text=document.createElement("span");
      text.textContent=item.text||"";

      line.append(name,text);
      container.appendChild(line);
    });

    container.scrollTop=container.scrollHeight;
  }
}

async function leaveRoom(){
  if(!roomCode || !uid || leavingRoom || actionBusy) return;

  leavingRoom=true;

  const code=roomCode;
  const oldUid=uid;
  const wasHost=isHost();

  try{
    if(wasHost){
      await db.ref().onDisconnect().cancel();

      const updates={};
      updates["rooms/"+code]=null;
      updates["privateHands/"+code]=null;

      await db.ref().update(updates);
    }else{
      const order=memberIds().filter(id=>id!==oldUid);
      const updates={};

      updates["rooms/"+code+"/members/"+oldUid]=null;
      updates["rooms/"+code+"/order"]=order;
      updates["privateHands/"+code+"/"+oldUid]=null;

      await db.ref().update(updates);
    }

    leaveLocal();
  }catch(error){
    console.error(error);
    leavingRoom=false;
    alert("방을 나가는 도중 오류가 발생했습니다.\n"+(error.code||"UNKNOWN")+" / "+error.message);
  }
}

function leaveLocal(){
  stopListeners();

  roomCode="";
  roomData=null;
  myHand=[];
  selectedHand.clear();
  selectedField=null;

  undoSnapshot=null;
  turnSnapshot=null;
  previousTurn=null;
  recoveryUsed=false;
  gameOverShown=false;
  disconnectArmed=false;
  leavingRoom=false;
  actionBusy=false;
  handLoaded=false;

  showScreen("menu");
}

$("createButton").addEventListener("click",createRoom);
$("joinButton").addEventListener("click",joinRoom);
$("readyButton").addEventListener("click",toggleReady);
$("saveSettings").addEventListener("click",saveSettings);
$("startButton").addEventListener("click",startOnlineGame);
$("leaveButton").addEventListener("click",leaveRoom);

$("sendChat").addEventListener("click",()=>sendChat("chatInput"));
$("gameSendChat").addEventListener("click",()=>sendChat("gameChatInput"));

$("chatInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") sendChat("chatInput");
});

$("gameChatInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") sendChat("gameChatInput");
});

$("drawButton").addEventListener("click",drawTile);
$("endButton").addEventListener("click",endTurn);
$("undoButton").addEventListener("click",restoreLastAction);
$("resetButton").addEventListener("click",resetTurn);

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && currentScreen==="game"){
    if(e.target.tagName==="INPUT") return;
    e.preventDefault();
    handleEnter();
  }

  if(e.key==="Escape" && currentScreen==="game"){
    endTurn();
  }

  if(e.key==="ArrowDown" && currentScreen==="game"){
    e.preventDefault();
    drawTile();
  }
});

login().catch(error=>{
  console.error("Firebase 로그인 오류:",error);
  alert("Firebase 로그인에 실패했습니다. Firebase 익명 로그인을 활성화했는지 확인하세요.\n"+error.message);
});
